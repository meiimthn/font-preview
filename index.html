/* Gulim & Gungsuh: system font fallback (ไฟล์เสีย/ไม่สามารถ subset ได้) */

:root{
  --bg:#f5f4f0;--card-bg:#fff;--border:#e2ddd5;
  --text:#1a1a1a;--muted:#999;--accent:#c0392b;
  --shadow:0 2px 12px rgba(0,0,0,0.06);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sarabun',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

header{background:#1a1a1a;color:#fff;padding:22px 32px 0;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,0.3);}
header h1{font-size:17px;font-weight:600;letter-spacing:0.06em;margin-bottom:12px;color:#f0ebe3;}
#textInput{width:100%;padding:11px 16px;font-size:22px;border:none;border-radius:8px;background:#2d2d2d;color:#fff;outline:none;font-family:inherit;transition:background .2s;}
#textInput::placeholder{color:#555;}
#textInput:focus{background:#363636;}
.tabs{display:flex;margin-top:14px;}
.tab-btn{padding:9px 28px;font-size:14px;font-family:'Sarabun',Tahoma,sans-serif;background:none;border:none;color:#666;cursor:pointer;border-bottom:3px solid transparent;font-weight:700;transition:color .15s,border-color .15s;letter-spacing:.04em;}
.tab-btn.active{color:#fff;border-bottom-color:#c0392b;}

.main{max-width:940px;margin:0 auto;padding:26px 20px 80px;}
.section-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;font-weight:700;}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:14px 20px;margin-bottom:10px;box-shadow:var(--shadow);display:flex;align-items:center;gap:20px;transition:box-shadow .2s;}
.card:hover{box-shadow:0 4px 22px rgba(0,0,0,.11);}
.card-meta{min-width:60px;width:60px;flex-shrink:0;border-right:1px solid #eeebe5;padding-right:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.font-num{font-size:18px;color:#bbb;font-weight:700;}
.font-tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:4px;margin-top:5px;font-weight:700;letter-spacing:.04em;}
.tag-google  {background:#e8f5e9;color:#2e7d32;}
.tag-embedded{background:#ede7f6;color:#4527a0;}
.tag-system  {background:#e3f2fd;color:#1565c0;}
.note-uppercase{font-size:10px;color:var(--accent);margin-top:4px;font-weight:700;}
.preview{font-size:40px;line-height:1.35;flex:1;word-break:break-word;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

@media(max-width:600px){
  header{padding:14px 14px 0;}
  .card{flex-direction:column;align-items:flex-start;gap:6px;}
  .card-meta{min-width:48px;width:48px;}
  .preview{font-size:28px;}
}
</style>

const tagLabels = {
  google:   {cls:'tag-google',   label:'Google Fonts ✓'},
  embedded: {cls:'tag-embedded', label:'Embedded ✓'},
  system:   {cls:'tag-system',   label:'System Font'},
};
function escapeHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}
function renderCards(fonts,cid){
  const input=document.getElementById('textInput');
  const box=document.getElementById(cid);
  function render(){
    box.innerHTML='';
    const raw=input.value||'Happy Birthday';
    fonts.forEach(f=>{
      const text=f.uppercase?raw.toUpperCase():raw;
      const tag=tagLabels[f.type];
      const c=document.createElement('div');
      c.className='card';
      c.innerHTML=`<div class="card-meta">
        <div class="font-num">${f.num}</div>
        ${f.uppercase?'<div class="note-uppercase">A–Z</div>':''}
      </div>
      <div class="preview" style="font-family:'${f.family}',serif;">${escapeHtml(text)}</div>`;
      box.appendChild(c);
    });
  }
  input.addEventListener('input',render);
  render();
}
function switchTab(lang,btn){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+lang).classList.add('active');
  btn.classList.add('active');
}

renderCards(fontsTH,'container-th');
